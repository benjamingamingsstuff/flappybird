<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Remake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
            background-color: #70c5ce;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Debug Overlay */
        #debug-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            display: none; /* Hidden by default, shown if errors */
            z-index: 100;
        }
        .error-text { color: #ff5555; }
        .success-text { color: #55ff55; }
    </style>
</head>
<body>

    <div id="debug-panel">
        <strong>SYSTEM CHECK:</strong><br>
        <div id="debug-log"></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONFIGURATION ---
        const ASSETS = {
            bird: 'bird.png',
            bg: 'bg.png',
            ground: 'ground.png',
            pipeTop: 'pipe_top.png',
            pipeBottom: 'pipe_bottom.png',
            title: 'title.png',
            get: 'get.png',
            ready: 'ready.png',
            tap: 'tap.png'
        };

        // --- SETUP CANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const debugPanel = document.getElementById('debug-panel');
        const debugLog = document.getElementById('debug-log');
        
        const GAME_WIDTH = 288; 
        const GAME_HEIGHT = 512;
        let scale = 1;

        function resize() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const gameRatio = GAME_WIDTH / GAME_HEIGHT;

            if (windowRatio < gameRatio) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerWidth / gameRatio;
            } else {
                canvas.height = window.innerHeight;
                canvas.width = window.innerHeight * gameRatio;
            }
            
            scale = canvas.width / GAME_WIDTH;
            ctx.imageSmoothingEnabled = false;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- ASSET LOADING WITH DIAGNOSTICS ---
        const images = {};
        let loadErrors = 0;
        let assetsLoaded = 0;
        const totalAssets = Object.keys(ASSETS).length;

        function logAsset(name, status) {
            const div = document.createElement('div');
            if (status === 'OK') {
                div.innerHTML = `${name}: <span class="success-text">OK</span>`;
            } else {
                div.innerHTML = `${name}: <span class="error-text">MISSING</span>`;
                loadErrors++;
                debugPanel.style.display = 'block'; // Show panel if there's an error
            }
            debugLog.appendChild(div);
        }

        function loadImages(callback) {
            for (let key in ASSETS) {
                const img = new Image();
                img.src = ASSETS[key];
                
                // Success Handler
                img.onload = () => {
                    logAsset(ASSETS[key], 'OK');
                    images[key] = { img: img, loaded: true };
                    checkDone();
                };
                
                // Error Handler
                img.onerror = () => {
                    logAsset(ASSETS[key], 'FAIL');
                    console.warn(`Failed to load ${ASSETS[key]}`);
                    images[key] = { img: null, loaded: false };
                    checkDone();
                };
            }

            function checkDone() {
                assetsLoaded++;
                if (assetsLoaded === totalAssets) {
                    if (loadErrors > 0) {
                        // Add a helper message if files are missing
                        const msg = document.createElement('div');
                        msg.style.marginTop = "10px";
                        msg.style.color = "white";
                        msg.innerHTML = "Check filenames carefully!<br>Make sure extensions (e.g. .png) are correct.";
                        debugLog.appendChild(msg);
                    }
                    callback();
                }
            }
        }

        // --- GAME VARIABLES ---
        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem('flappy_highscore') || 0;
        let state = { current: 0, getReady: 0, game: 1, over: 2 };

        // --- SOUNDS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'score') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- GAME OBJECTS ---
        const bg = {
            draw: function() {
                if (images.bg.loaded) {
                    ctx.drawImage(images.bg.img, 0, 0, GAME_WIDTH, GAME_HEIGHT);
                } else {
                    ctx.fillStyle = '#70c5ce';
                    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                }
            }
        };

        const ground = {
            x: 0, y: GAME_HEIGHT - 112, w: GAME_WIDTH, h: 112, dx: 2,
            draw: function() {
                if (images.ground.loaded) {
                    ctx.drawImage(images.ground.img, this.x, this.y, GAME_WIDTH + 10, this.h);
                    ctx.drawImage(images.ground.img, this.x + GAME_WIDTH, this.y, GAME_WIDTH + 10, this.h);
                } else {
                    ctx.fillStyle = '#ded895';
                    ctx.fillRect(this.x, this.y, GAME_WIDTH, this.h);
                    ctx.fillStyle = '#73bf2e';
                    ctx.fillRect(this.x, this.y, GAME_WIDTH, 20);
                }
            },
            update: function() {
                if (state.current === state.game || state.current === state.getReady) {
                    this.x = (this.x - this.dx) % GAME_WIDTH;
                    if (this.x <= -GAME_WIDTH) this.x = 0;
                }
            }
        };

        const bird = {
            x: 50, y: 150, w: 34, h: 24, speed: 0, rotation: 0,
            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                if (images.bird.loaded) {
                    ctx.drawImage(images.bird.img, -this.w/2, -this.h/2, this.w, this.h);
                } else {
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            },
            flap: function() { this.speed = -4.6; playSound('flap'); },
            update: function() {
                if (state.current === state.getReady) {
                    this.y = 150 + Math.cos(frames/15) * 5;
                    this.rotation = 0;
                } else if (state.current === state.game) {
                    this.speed += 0.25;
                    this.y += this.speed;
                    if (this.speed < 2 && this.rotation > -25*Math.PI/180) this.rotation = -25*Math.PI/180;
                    else if (this.speed > 0) {
                        this.rotation += 2*Math.PI/180;
                        if (this.rotation > 90*Math.PI/180) this.rotation = 90*Math.PI/180;
                    }
                    if (this.y + this.h/2 >= GAME_HEIGHT - 112) {
                        this.y = GAME_HEIGHT - 112 - this.h/2;
                        state.current = state.over; playSound('hit');
                    }
                } else if (state.current === state.over) {
                    if (this.y + this.h/2 < GAME_HEIGHT - 112) {
                        this.speed += 0.25; this.y += this.speed;
                        this.rotation = 90*Math.PI/180;
                    }
                }
            },
            reset: function() { this.speed = 0; this.rotation = 0; this.y = 150; }
        };

        const pipes = {
            position: [], w: 52, h: 400, dx: 2, gap: 100,
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.h + this.gap;

                    if (images.pipeTop.loaded) {
                         // Draw top pipe hanging down
                        ctx.drawImage(images.pipeTop.img, p.x, p.y - images.pipeTop.img.height);
                    } else {
                        ctx.fillStyle = '#73bf2e'; ctx.fillRect(p.x, 0, this.w, p.y);
                        ctx.strokeStyle = '#558c22'; ctx.strokeRect(p.x, 0, this.w, p.y);
                    }

                    if (images.pipeBottom.loaded) {
                        ctx.drawImage(images.pipeBottom.img, p.x, bottomY);
                    } else {
                        ctx.fillStyle = '#73bf2e'; ctx.fillRect(p.x, bottomY, this.w, GAME_HEIGHT - bottomY - 112);
                        ctx.strokeStyle = '#558c22'; ctx.strokeRect(p.x, bottomY, this.w, GAME_HEIGHT - bottomY - 112);
                    }
                }
            },
            update: function() {
                if (state.current !== state.game) return;
                if (frames % 100 === 0) {
                    const maxY = GAME_HEIGHT - 112 - this.gap - 50;
                    this.position.push({ x: GAME_WIDTH, y: Math.floor(Math.random()*(maxY-50+1)+50), passed: false });
                }
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;
                    
                    // Collision
                    let birdLeft = bird.x - bird.w/2 + 5;
                    let birdRight = bird.x + bird.w/2 - 5;
                    let birdTop = bird.y - bird.h/2 + 5;
                    let birdBottom = bird.y + bird.h/2 - 5;
                    let pipeLeft = p.x;
                    let pipeRight = p.x + this.w;
                    let topPipeBottom = p.y;
                    let bottomPipeTop = p.y + this.gap;

                    if ((birdRight > pipeLeft && birdLeft < pipeRight && birdTop < topPipeBottom) ||
                        (birdRight > pipeLeft && birdLeft < pipeRight && birdBottom > bottomPipeTop)) {
                        state.current = state.over; playSound('hit');
                    }

                    if (p.x + this.w < birdLeft && !p.passed) {
                        score++; p.passed = true; playSound('score');
                        highScore = Math.max(score, highScore);
                        localStorage.setItem('flappy_highscore', highScore);
                    }
                    if (p.x + this.w <= 0) { this.position.shift(); i--; }
                }
            },
            reset: function() { this.position = []; }
        };

        const ui = {
            draw: function() {
                if (state.current === state.game) {
                    ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                    ctx.font = "35px Impact"; ctx.textAlign = "center";
                    ctx.fillText(score, GAME_WIDTH/2, 50); ctx.strokeText(score, GAME_WIDTH/2, 50);
                } else if (state.current === state.getReady) {
                    if (images.title.loaded) ctx.drawImage(images.title.img, GAME_WIDTH/2 - images.title.img.width/2, 50);
                    else { ctx.fillStyle = "orange"; ctx.font = "30px Impact"; ctx.textAlign = "center"; ctx.fillText("FLAPPY BIRD", GAME_WIDTH/2, 80); }

                    if (images.get.loaded && images.ready.loaded) {
                        const totalW = images.get.img.width + images.ready.img.width + 10;
                        ctx.drawImage(images.get.img, GAME_WIDTH/2 - totalW/2, 180);
                        ctx.drawImage(images.ready.img, GAME_WIDTH/2 - totalW/2 + images.get.img.width + 10, 180);
                    } else { ctx.fillStyle = "white"; ctx.font = "30px Impact"; ctx.fillText("Get Ready!", GAME_WIDTH/2, 200); }

                    if (images.tap.loaded) ctx.drawImage(images.tap.img, GAME_WIDTH/2 - images.tap.img.width/2, 250);
                    else ctx.fillText("(Tap)", GAME_WIDTH/2, 250);
                } else if (state.current === state.over) {
                    ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                    ctx.font = "40px Impact"; ctx.textAlign = "center";
                    ctx.fillText("GAME OVER", GAME_WIDTH/2, 150); ctx.strokeText("GAME OVER", GAME_WIDTH/2, 150);
                    ctx.font = "25px Impact";
                    ctx.fillText("Score: " + score, GAME_WIDTH/2, 200);
                    ctx.fillText("Best: " + highScore, GAME_WIDTH/2, 230);
                }
            }
        };

        function loop() {
            bird.update(); ground.update(); pipes.update();
            
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.scale(scale, scale);
            bg.draw(); pipes.draw(); ground.draw(); bird.draw(); ui.draw();
            ctx.restore();
            
            frames++;
            requestAnimationFrame(loop);
        }

        window.addEventListener("click", () => handleInput());
        window.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "ArrowUp") handleInput(); });
        window.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(); }, {passive: false});

        function handleInput() {
            if (state.current === state.getReady) { state.current = state.game; bird.flap(); }
            else if (state.current === state.game) bird.flap();
            else if (state.current === state.over) {
                bird.reset(); pipes.reset(); score = 0; frames = 0; state.current = state.getReady;
            }
        }

        loadImages(() => loop());
    </script>
</body>
</html>
