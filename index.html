<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background-color: #70c5ce;
            max-height: 100%;
            max-width: 100%;
        }
        /* This console will ALWAYS show if there is an error */
        #debug-console {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            overflow-y: scroll;
            z-index: 9999;
            pointer-events: none;
            display: none; /* Hidden by default, shown on error */
            border-bottom: 2px solid red;
        }
        .log-entry { margin: 2px 5px; border-bottom: 1px solid #333; }
        .log-error { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Visual Error Log -->
    <div id="debug-console">
        <div class="log-entry" style="color:white">--- SYSTEM LOG ---</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // 1. IMMEDIATE ERROR TRAPPING
        const consoleDiv = document.getElementById('debug-console');
        
        function log(message, isError = false) {
            // Only show the console if there is an actual error or warning
            if (isError) consoleDiv.style.display = 'block';
            
            const div = document.createElement('div');
            div.className = isError ? 'log-entry log-error' : 'log-entry';
            div.innerText = (isError ? "[ERROR] " : "[INFO] ") + message;
            consoleDiv.appendChild(div);
            console.log(message);
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            log(`Global Error: ${msg} at line ${lineNo}`, true);
            return false;
        };

        try {
            // --- CONFIGURATION ---
            // Ensure these match your files exactly.
            const ASSETS = {
                bird: 'bird.png',
                bg: 'bg.png',
                ground: 'ground.png',
                pipeTop: 'pipe_top.png',
                pipeBottom: 'pipe_bottom.png',
                title: 'title.png',
                get: 'get.png',
                ready: 'ready.png',
                tap: 'tap.png'
            };

            // --- CANVAS SETUP ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Virtual Resolution (The game logic runs at this size)
            const V_WIDTH = 288;
            const V_HEIGHT = 512;
            let scale = 1;

            function resizeCanvas() {
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const scaleW = winW / V_WIDTH;
                const scaleH = winH / V_HEIGHT;
                
                scale = Math.min(scaleW, scaleH);
                
                canvas.width = V_WIDTH * scale;
                canvas.height = V_HEIGHT * scale;
                
                ctx.imageSmoothingEnabled = false;
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); // Call immediately

            // --- ASSET LOADING (NON-BLOCKING) ---
            // The game will run even if these fail.
            const images = {};
            Object.keys(ASSETS).forEach(key => {
                const img = new Image();
                img.src = ASSETS[key];
                images[key] = { img: img, loaded: false };
                
                img.onload = () => { images[key].loaded = true; };
                img.onerror = () => { 
                    // Log silently, don't stop game
                    console.warn(`Asset missed: ${ASSETS[key]}`); 
                };
            });

            // --- GAME STATE ---
            let frames = 0;
            let score = 0;
            let highScore = localStorage.getItem('flappy_highscore') || 0;
            
            const state = {
                current: 0,
                getReady: 0,
                game: 1,
                over: 2
            };

            // --- GAME OBJECTS ---
            const bird = {
                x: 50, y: 150, w: 34, h: 24, speed: 0, rotation: 0,
                draw: function() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    if (images.bird.loaded) {
                        ctx.drawImage(images.bird.img, -this.w/2, -this.h/2, this.w, this.h);
                    } else {
                        // Fallback Box
                        ctx.fillStyle = "yellow";
                        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                    }
                    ctx.restore();
                },
                flap: function() {
                    this.speed = -4.6;
                },
                update: function() {
                    if (state.current === state.getReady) {
                        this.y = 150 - 5 + Math.cos(frames/15) * 5;
                        this.rotation = 0;
                    } else if (state.current === state.game) {
                        this.speed += 0.25; // Gravity
                        this.y += this.speed;

                        // Rotation
                        if (this.speed < 2.2 && this.rotation > -25 * 0.017) {
                            this.rotation = -25 * 0.017;
                        } else if (this.speed > 0) {
                            this.rotation += 2 * 0.017;
                            if (this.rotation > 90 * 0.017) this.rotation = 90 * 0.017;
                        }

                        // Floor Collision
                        if (this.y + this.h/2 >= V_HEIGHT - 112) {
                            this.y = V_HEIGHT - 112 - this.h/2;
                            state.current = state.over;
                        }
                    } else if (state.current === state.over) {
                         if (this.y + this.h/2 < V_HEIGHT - 112) {
                            this.speed += 0.25;
                            this.y += this.speed;
                            this.rotation = 90 * 0.017;
                         }
                    }
                },
                reset: function() {
                    this.y = 150;
                    this.speed = 0;
                    this.rotation = 0;
                }
            };

            const ground = {
                x: 0, h: 112,
                draw: function() {
                    if (images.ground.loaded) {
                        ctx.drawImage(images.ground.img, this.x, V_HEIGHT - this.h, V_WIDTH + 20, this.h);
                        ctx.drawImage(images.ground.img, this.x + V_WIDTH, V_HEIGHT - this.h, V_WIDTH + 20, this.h);
                    } else {
                        ctx.fillStyle = "#ded895";
                        ctx.fillRect(0, V_HEIGHT - this.h, V_WIDTH, this.h);
                        ctx.fillStyle = "#73bf2e";
                        ctx.fillRect(0, V_HEIGHT - this.h, V_WIDTH, 20);
                    }
                },
                update: function() {
                    if (state.current === state.game || state.current === state.getReady) {
                        this.x = (this.x - 2) % (V_WIDTH);
                        if (this.x <= -V_WIDTH) this.x = 0;
                    }
                }
            };

            const pipes = {
                position: [], w: 52, h: 400, gap: 100,
                draw: function() {
                    for (let i = 0; i < this.position.length; i++) {
                        let p = this.position[i];
                        let topY = p.y;
                        let bottomY = p.y + this.h + this.gap;

                        if (images.pipeTop.loaded) {
                            // Draw top pipe so its bottom touches topY
                            ctx.drawImage(images.pipeTop.img, p.x, topY - images.pipeTop.img.height);
                        } else {
                            ctx.fillStyle = "green";
                            ctx.fillRect(p.x, 0, this.w, topY);
                        }

                        if (images.pipeBottom.loaded) {
                            ctx.drawImage(images.pipeBottom.img, p.x, bottomY);
                        } else {
                            ctx.fillStyle = "green";
                            ctx.fillRect(p.x, bottomY, this.w, V_HEIGHT - bottomY - 112);
                        }
                    }
                },
                update: function() {
                    if (state.current !== state.game) return;

                    if (frames % 100 === 0) {
                        const maxY = V_HEIGHT - 112 - this.gap - 50;
                        const minY = 50;
                        const randomY = Math.floor(Math.random() * (maxY - minY + 1) + minY);
                        this.position.push({ x: V_WIDTH, y: randomY, passed: false });
                    }

                    for (let i = 0; i < this.position.length; i++) {
                        let p = this.position[i];
                        p.x -= 2;

                        // Simple Collision
                        let birdLeft = bird.x - bird.w/2 + 5;
                        let birdRight = bird.x + bird.w/2 - 5;
                        let birdTop = bird.y - bird.h/2 + 5;
                        let birdBottom = bird.y + bird.h/2 - 5;

                        let pipeLeft = p.x;
                        let pipeRight = p.x + this.w;
                        let topPipeY = p.y;
                        let bottomPipeY = p.y + this.gap;

                        // Check collision
                        if (birdRight > pipeLeft && birdLeft < pipeRight) {
                            if (birdTop < topPipeY || birdBottom > bottomPipeY) {
                                state.current = state.over;
                            }
                        }

                        // Score
                        if (p.x + this.w < birdLeft && !p.passed) {
                            score++;
                            p.passed = true;
                            highScore = Math.max(score, highScore);
                            localStorage.setItem('flappy_highscore', highScore);
                        }

                        if (p.x + this.w <= 0) {
                            this.position.shift();
                            i--;
                        }
                    }
                },
                reset: function() { this.position = []; }
            };

            // --- MAIN LOOP ---
            function draw() {
                // Clear Screen
                ctx.fillStyle = "#70c5ce";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Scale Context to match Virtual Resolution
                ctx.save();
                ctx.scale(scale, scale);

                // 1. BG
                if (images.bg.loaded) ctx.drawImage(images.bg.img, 0, 0, V_WIDTH, V_HEIGHT);
                else { ctx.fillStyle="#70c5ce"; ctx.fillRect(0,0,V_WIDTH, V_HEIGHT); }

                // 2. Pipes
                pipes.draw();

                // 3. Ground (Foreground)
                ground.draw();

                // 4. Bird
                bird.draw();

                // 5. UI
                ctx.fillStyle = "#FFF";
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;

                if (state.current === state.getReady) {
                    if (images.title.loaded) {
                         const tW = images.title.img.width; 
                         ctx.drawImage(images.title.img, V_WIDTH/2 - tW/2, 50);
                    } else {
                        ctx.font = "30px Arial"; 
                        ctx.textAlign = "center"; 
                        ctx.strokeText("FLAPPY BIRD", V_WIDTH/2, 80);
                        ctx.fillText("FLAPPY BIRD", V_WIDTH/2, 80);
                    }
                    
                    if (images.tap.loaded) {
                        ctx.drawImage(images.tap.img, V_WIDTH/2 - images.tap.img.width/2, 200);
                    } else {
                        ctx.font = "20px Arial"; 
                        ctx.textAlign = "center"; 
                        ctx.fillText("Tap to Start", V_WIDTH/2, 230);
                    }
                } else if (state.current === state.game) {
                    ctx.font = "40px Impact";
                    ctx.textAlign = "center";
                    ctx.fillText(score, V_WIDTH/2, 50);
                    ctx.strokeText(score, V_WIDTH/2, 50);
                } else if (state.current === state.over) {
                    ctx.font = "40px Impact";
                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER", V_WIDTH/2, 150);
                    ctx.strokeText("GAME OVER", V_WIDTH/2, 150);
                    
                    ctx.font = "20px Arial";
                    ctx.fillText("Score: " + score, V_WIDTH/2, 200);
                    ctx.fillText("Best: " + highScore, V_WIDTH/2, 230);
                }

                ctx.restore();
            }

            function update() {
                bird.update();
                ground.update();
                pipes.update();
            }

            function loop() {
                update();
                draw();
                frames++;
                requestAnimationFrame(loop);
            }

            // Start immediately
            loop();

            // --- CONTROLS ---
            function action() {
                if (state.current === state.getReady) {
                    state.current = state.game;
                    bird.flap();
                } else if (state.current === state.game) {
                    bird.flap();
                } else if (state.current === state.over) {
                    state.current = state.getReady;
                    bird.reset();
                    pipes.reset();
                    score = 0;
                    frames = 0;
                }
            }

            window.addEventListener('mousedown', action);
            window.addEventListener('touchstart', (e) => { e.preventDefault(); action(); }, {passive: false});
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') action();
            });

        } catch (e) {
            log(e.message, true);
        }
    </script>
</body>
</html>
